<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="auto" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Sharp 90-degree canvas border -->
  <rect x="1" y="1" width="958" height="428" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title & Date (14px title, 11px subtitle) -->
  <text x="480" y="34" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">OVERALL HYBRID META-SCORE (4-PILLAR EVALUATION)</text>
  <text x="480" y="54" fill="#8b949e" font-size="11" text-anchor="middle">Balanced Synthesis: 35% Spelling, 25% Grammar, 20% Voice, 20% Anti-Hallucination | November 13, 2026</text>

  <!-- Y-Axis Gridlines & Ticks (10px ticks) -->
  <line x1="80" y1="340" x2="900" y2="340" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="275" x2="900" y2="275" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="210" x2="900" y2="210" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="145" x2="900" y2="145" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="80" x2="900" y2="80" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="70" y="344" fill="#8b949e" font-size="10" text-anchor="end">0%</text>
  <text x="70" y="279" fill="#8b949e" font-size="10" text-anchor="end">25%</text>
  <text x="70" y="214" fill="#8b949e" font-size="10" text-anchor="end">50%</text>
  <text x="70" y="149" fill="#8b949e" font-size="10" text-anchor="end">75%</text>
  <text x="70" y="84" fill="#8b949e" font-size="10" text-anchor="end">100%</text>

  <!-- Sharp 90-degree Monochrome Bars -->
  <!-- 1. DeepL Write (Neural Rewriter): 82.7% -> h = 215px, y = 340 - 215 = 125 -->
  <rect x="140" y="125" width="135" height="215" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="207" y="114" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">82.7%</text>
  <text x="207" y="360" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">DeepL Write</text>
  <text x="207" y="378" fill="#8b949e" font-size="10" text-anchor="middle">~1,280 ms (Neural Rewriter)</text>

  <!-- 2. TextGears API: 72.0% -> h = 187px, y = 340 - 187 = 153 -->
  <rect x="330" y="153" width="135" height="187" fill="#6e7681" stroke="#8b949e" stroke-width="1"/>
  <text x="397" y="142" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">72.0%</text>
  <text x="397" y="360" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">TextGears API</text>
  <text x="397" y="378" fill="#8b949e" font-size="10" text-anchor="middle">~967 ms (Commercial)</text>

  <!-- 3. LanguageTool API: 71.4% -> h = 186px, y = 340 - 186 = 154 -->
  <rect x="520" y="154" width="135" height="186" fill="#8b949e" stroke="#c9d1d9" stroke-width="1"/>
  <text x="587" y="143" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">71.4%</text>
  <text x="587" y="360" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">LanguageTool API</text>
  <text x="587" y="378" fill="#8b949e" font-size="10" text-anchor="middle">~677 ms (Free Open-Source)</text>

  <!-- 4. BCorrect (FMM Engine): 61.8% -> h = 161px, y = 340 - 161 = 179 -->
  <rect x="710" y="179" width="135" height="161" fill="#e6edf3" stroke="#ffffff" stroke-width="2"/>
  <text x="777" y="168" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">61.8%</text>
  <text x="777" y="360" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BCorrect (FMM)</text>
  <text x="777" y="378" fill="#c9d1d9" font-size="10" font-weight="600" text-anchor="middle">~18 ms (Sub-Keystroke 1 vCPU)</text>

  <!-- Footer Note (10px) -->
  <text x="480" y="408" fill="#8b949e" font-size="10" text-anchor="middle">Evaluated live across 10 blind human writing domains with multi-reference dialect equivalence on November 13, 2026.</text>
</svg>