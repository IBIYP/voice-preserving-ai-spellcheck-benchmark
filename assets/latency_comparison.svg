<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="auto" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Sharp 90-degree canvas border -->
  <rect x="1" y="1" width="958" height="328" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title & Date (14px title, 11px subtitle) -->
  <text x="480" y="34" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">AVERAGE QUERY INFERENCE LATENCY (LOWER IS BETTER)</text>
  <text x="480" y="54" fill="#8b949e" font-size="11" text-anchor="middle">Sub-Keystroke Local Engine (~18ms) vs. Cloud Developer REST APIs | Run Date: November 13, 2026</text>

  <!-- Sharp 90-degree Horizontal Bars in Grayscale -->
  <!-- 1. BCorrect (FMM): 18ms -> w = 22px -->
  <text x="210" y="105" fill="#ffffff" font-size="11" font-weight="700" text-anchor="end">BCorrect (1 vCPU Local)</text>
  <rect x="220" y="88" width="22" height="26" fill="#e6edf3" stroke="#ffffff" stroke-width="1.5"/>
  <text x="252" y="105" fill="#ffffff" font-size="11" font-weight="700">~18 ms</text>
  <text x="315" y="105" fill="#8b949e" font-size="10">(Sub-Keystroke Baseline, 1.0x)</text>

  <!-- 2. LanguageTool API: 677ms -> w = 354px -->
  <text x="210" y="155" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="end">LanguageTool API</text>
  <rect x="220" y="138" width="354" height="26" fill="#8b949e" stroke="#c9d1d9" stroke-width="1"/>
  <text x="584" y="155" fill="#c9d1d9" font-size="11" font-weight="600">~677 ms</text>
  <text x="655" y="155" fill="#8b949e" font-size="10">(37x slower)</text>

  <!-- 3. TextGears API: 967ms -> w = 505px -->
  <text x="210" y="205" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="end">TextGears API</text>
  <rect x="220" y="188" width="505" height="26" fill="#6e7681" stroke="#8b949e" stroke-width="1"/>
  <text x="735" y="205" fill="#c9d1d9" font-size="11" font-weight="600">~967 ms</text>
  <text x="805" y="205" fill="#8b949e" font-size="10">(53x slower)</text>

  <!-- 4. DeepL Write: 1,280ms -> w = 669px -->
  <text x="210" y="255" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="end">DeepL Write</text>
  <rect x="220" y="238" width="669" height="26" fill="#30363d" stroke="#484f58" stroke-width="1"/>
  <text x="898" y="255" fill="#8b949e" font-size="11" font-weight="600">~1,280 ms</text>

  <!-- Bottom Scale Line (10px ticks) -->
  <line x1="220" y1="285" x2="889" y2="285" stroke="#30363d" stroke-width="1"/>
  <text x="220" y="304" fill="#8b949e" font-size="10">0 ms</text>
  <text x="481" y="304" fill="#8b949e" font-size="10">500 ms</text>
  <text x="742" y="304" fill="#8b949e" font-size="10">1000 ms</text>
  <text x="889" y="304" fill="#8b949e" font-size="10">1300 ms</text>
</svg>